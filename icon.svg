<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1526"/><stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="halo" cx="62%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#e7c98a" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#caa15a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#caa15a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c89a55"/><stop offset="0.5" stop-color="#f6e3b4"/><stop offset="1" stop-color="#fbeecb"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c08d" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#e3c08d" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- línea base sutil -->
  <line x1="230" y1="712" x2="794" y2="712" stroke="#e3c08d" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/>

  <!-- área bajo la curva -->
  <path d="M230 712 L230 678 C 350 678 408 566 506 542 C 604 518 660 470 794 312 L794 712 Z" fill="url(#ar)"/>
  <!-- curva de crecimiento del patrimonio -->
  <path d="M230 678 C 350 678 408 566 506 542 C 604 518 660 470 794 312"
        fill="none" stroke="url(#ln)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>

  <!-- punto "en vivo" al final (igual que en el gráfico de la app) -->
  <circle cx="794" cy="312" r="52" fill="#f6e3b4" opacity="0.16"/>
  <circle cx="794" cy="312" r="24" fill="#fbeecb" filter="url(#gl)"/>
  <circle cx="782" cy="300" r="7" fill="#ffffff" opacity="0.9"/>
</svg>
