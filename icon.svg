<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="82%">
      <stop offset="0" stop-color="#1b1b18"/>
      <stop offset="55%" stop-color="#121210"/>
      <stop offset="100%" stop-color="#0A0A08"/>
    </radialGradient>
    <radialGradient id="halo" cx="56%" cy="40%" r="56%">
      <stop offset="0" stop-color="#D4A853" stop-opacity=".42"/>
      <stop offset="60%" stop-color="#D4A853" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#D4A853" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98E3A"/>
      <stop offset="55%" stop-color="#E6C171"/>
      <stop offset="100%" stop-color="#F2D98C"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A853" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#D4A853" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo papel oscuro + halo oro (luz desde arriba) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- Cuadrícula sutil tipo terminal financiera -->
  <g stroke="#F0EDE0" stroke-opacity=".05" stroke-width="2">
    <line x1="250" y1="455" x2="774" y2="455"/>
    <line x1="250" y1="607" x2="774" y2="607"/>
  </g>

  <!-- Área bajo la curva -->
  <path d="M250 700 L364 561 L478 608 L637 446 L774 330 L774 760 L250 760 Z" fill="url(#area)"/>
  <!-- Línea base -->
  <line x1="250" y1="760" x2="774" y2="760" stroke="#D4A853" stroke-opacity=".30" stroke-width="6" stroke-linecap="round"/>
  <!-- Curva de rendimiento de cartera (degradado oro) -->
  <polyline points="250,700 364,561 478,608 637,446 774,330" fill="none" stroke="url(#line)"
            stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Punto pico — firma bermejo -->
  <circle cx="774" cy="330" r="34" fill="#C8553D" filter="url(#glow)"/>
  <circle cx="774" cy="330" r="34" fill="none" stroke="#E07055" stroke-width="6" opacity=".6"/>
  <!-- Destello especular -->
  <circle cx="763" cy="319" r="9" fill="#fff" opacity=".82"/>
</svg>
